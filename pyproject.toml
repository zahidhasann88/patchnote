[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patchnote"
version = "0.1.1"
description = "Turn git commits and merged pull requests into clean changelogs and release notes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Zahid Hasan", email = "jahidhasann67@gmail.com" },
]
keywords = [
    "changelog",
    "release-notes",
    "conventional-commits",
    "git",
    "github-actions",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-pyyaml>=6.0",
    "build>=1.2",
    "twine>=6",
]

[project.urls]
Homepage = "https://github.com/zahidhasann88/patchnote"
Documentation = "https://github.com/zahidhasann88/patchnote#readme"
Issues = "https://github.com/zahidhasann88/patchnote/issues"
Source = "https://github.com/zahidhasann88/patchnote"
Changelog = "https://github.com/zahidhasann88/patchnote/blob/main/CHANGELOG.md"

[project.scripts]
patchnote = "patchnote.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/patchnote"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/tools",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/action.yml",
]

[tool.ruff]
src = ["src", "tests", "tools"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
    "RUF",
    "C4",
    "ISC",
    "PIE",
    "PGH",
]
ignore = [
    "ISC001",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N803", "RUF001"]
"src/patchnote/cli.py" = ["B008"]
"tools/**" = ["N802", "RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["patchnote", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["patchnote"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_reexport = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=patchnote",
    "--cov-report=term-missing",
    "--cov-fail-under=85",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["patchnote"]
branch = true
omit = ["src/patchnote/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = true
skip_covered = false
