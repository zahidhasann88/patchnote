name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check src tests tools
          ruff format --check src tests tools

      - name: Mypy
        run: mypy src

      - name: Tests
        run: pytest --cov=patchnote --cov-report=term-missing --cov-fail-under=85
        env:
          GIT_AUTHOR_NAME: Test User
          GIT_AUTHOR_EMAIL: test@example.com
          GIT_COMMITTER_NAME: Test User
          GIT_COMMITTER_EMAIL: test@example.com

  action-smoke:
    name: Action entrypoint smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Run action entrypoint
        env:
          GITHUB_OUTPUT: ${{ runner.temp }}/github_output
          GITHUB_WORKSPACE: ${{ github.workspace }}
          PATCHNOTE_VERSION: "0.0.0-ci"
          PATCHNOTE_AI: none
        run: python -m patchnote.action_entry

  build:
    name: Build and install distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install the wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/verify-venv"
          "$RUNNER_TEMP/verify-venv/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/verify-venv/bin/patchnote" --version
          "$RUNNER_TEMP/verify-venv/bin/patchnote" --help

  demo:
    name: Local Git and fake LLM demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install .
      - name: Run the offline demo
        run: python tools/demo.py --outdir "$RUNNER_TEMP/patchnote-demo"
