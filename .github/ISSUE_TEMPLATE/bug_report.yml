name: Bug report
description: Something is not working the way the docs say it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time. Please do not include secrets, tokens, or private commit messages.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you run, and what did you see?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Patchnote version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12"
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: A minimal git history, config, and command. Redact tokens.
      render: bash
