# Manually generate CHANGELOG.md and open a pull request with the result.
#
# Least privilege: contents: write (push a branch) and pull-requests: write.
name: Update changelog
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to record (e.g. 1.4.0)
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        uses: YOUR_NAME/patchnote@v0.1.0
        with:
          version: ${{ inputs.version }}
          output-file: CHANGELOG.md
          prepend: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Open pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "docs: update changelog for ${{ inputs.version }}"
          title: "docs: changelog for ${{ inputs.version }}"
          body: |
            Generated by Patchnote for version `${{ inputs.version }}`.
          branch: docs/changelog-${{ inputs.version }}
          labels: documentation
