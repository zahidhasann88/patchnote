# Lint the commits on a pull request and post a changelog preview comment.
#
# Permissions:
#   contents: read       — checkout + git history
#   pull-requests: write — post the preview comment
#
# Fork PRs: workflows triggered by `pull_request` from a fork get a read-only
# GITHUB_TOKEN. The check still runs; the comment step is skipped because it
# cannot write to the base repository. This example does not use
# `pull_request_target` (that event runs privileged code against untrusted
# branches — avoid it unless you fully understand the trade-offs).
name: Changelog check
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Patchnote
        run: python -m pip install "patchnote==0.1.0"

      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime, timezone
          from patchnote.check import run_check
          from patchnote.config import parse_config
          from patchnote.model import Commit
          title = Commit(hash="0" * 40, short_hash="0" * 7, author_name="", author_email="", author_date=datetime.now(timezone.utc), subject=os.environ["PR_TITLE"])
          run_check([title], parse_config({}))
          PY

      - name: Check commit messages on this PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: patchnote check --from "$BASE_SHA" --to HEAD

      - name: Preview changelog
        id: preview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          notes=$(patchnote generate --from "$BASE_SHA" --to HEAD)
          delimiter="EOF_$(python -c 'import secrets; print(secrets.token_hex(8))')"
          {
            echo "notes<<$delimiter"
            printf '%s\n' "$notes"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Comment preview
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          NOTES: ${{ steps.preview.outputs.notes }}
        with:
          script: |
            const body = [
              '<!-- patchnote-preview -->',
              '### Changelog preview',
              '',
              '```markdown',
              process.env.NOTES,
              '```',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body && c.body.includes('<!-- patchnote-preview -->'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
