# Lint the commits on a pull request and post a changelog preview comment.
#
# Permissions:
#   contents: read       — checkout + git history
#   pull-requests: write — post the preview comment
#
# Fork PRs: workflows triggered by `pull_request` from a fork get a read-only
# GITHUB_TOKEN. The check still runs; the comment step is skipped because it
# cannot write to the base repository. This example does not use
# `pull_request_target` (that event runs privileged code against untrusted
# branches — avoid it unless you fully understand the trade-offs).
name: Changelog check
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install patchnote
        run: python -m pip install patchnote

      - name: Check commit messages on this PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: patchnote check --from "origin/${{ github.base_ref }}" --to HEAD

      - name: Preview changelog
        id: preview
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes=$(patchnote generate --from "origin/${{ github.base_ref }}" --to HEAD)
          delimiter="EOF_$(python -c 'import secrets; print(secrets.token_hex(8))')"
          {
            echo "notes<<$delimiter"
            printf '%s\n' "$notes"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Comment preview
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          NOTES: ${{ steps.preview.outputs.notes }}
        with:
          script: |
            const body = [
              '<!-- patchnote-preview -->',
              '### Changelog preview',
              '',
              '```markdown',
              process.env.NOTES,
              '```',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes('<!-- patchnote-preview -->'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
